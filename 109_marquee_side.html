<html>
    <head>
        <title>
            marquee tag example 
        </title>
    </head>
    <body >
        <marquee behavior="slide" direction="down" height="50%">
            <center> bca </center>
        </marquee>

        <marquee behavior="slide" direction="right" width="50%" scrollamount="11">
             bca
</marquee>

<marquee behavior="slide" direction="left" width="48%" scrollamount="11">
   bca 
</marquee>

<marquee behavior="slide" direction="up" height="50%" scrollamount="6">
            <center>  bca </center>
    </marquee>

        
    
    </body>
</html>
