<html>
    <head>
        <title> element selector </title>
        <style>
            p
            {
                text-align: center;
                color: greenyellow;
            }
            h1
            {
                text-align: center;
                color: blue;
                border: 10px powderblue groove;
            }
        </style>
    </head>

        <p>   my first paragraph</p>
        <p>   my second paragraph</p>
        <h1>   HTML</h1>
        <H1>      BCA</H1>
    </body>
</html>
