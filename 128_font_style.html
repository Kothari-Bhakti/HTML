<!--
  font properties
-->
  <html>
    <head>
        <title>    font style example</title>
        <style> 
        h1.o
            {
             font-style: oblique;
            }
            h1.n
            {
                 font-style: normal;
            }
            h1.i
            {
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1 class="i"> BCA</h1>
        <h1 class="o"> BCA</h1>
        <h1 class="n">BCA</h1>
        </body>
    </html>
