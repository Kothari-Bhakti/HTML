<html>
    <head>
        <title> text align example</title>
        <style>
           h1
           {
            text-align: right;

           }
            h2
            {
                text-align: center;
            }
            h3
            {
                text-align: left;
            }
        </style>
    </head>
    <body>
        <h1> bca</h1>
        <h2> bca</h2>
        <h3> bca</h3>
    </body>
</html>
