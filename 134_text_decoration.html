<html>
    <head>
        <title>
            text decoration example
        </title>
        <style>
            h1
            {
               text-decoration: underline;
            }
            h2
            {
               text-decoration: overline;
            
            }
            h3
            {
               text-decoration: none;
            
            }
            h4
            {
               text-decoration: line-through;
            }
        </style>
    </head>
    <body>
        <h1> my first paragraph</h1>
        <h2> HTML</h2>
        <h3> BCA</h3>
        <h4> SEM 1<h4>
    </body>
</html>
