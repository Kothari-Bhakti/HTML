<html>
    <head>
        <title> text transform</title>
        <style>
            h1
            {
                text-transform: uppercase;
            }
            h2
            {
                text-transform: lowercase;
            }
            h3
            {
                text-transform: none;
            }
            h4
            {
                text-transform: capitalize;
            }
        </style>
    </head>
    <body>
        <h1> bca</h1>
        <h2> BCA</h2>
        <h3> bca</h3>
        <h4> bca</h4>
    </body>

</html>
