<html>
    <head>
        <title>   list style example</title>
        <style>
            ul.a
            {
                list-style-type: circle;
            }
            ul.b
            {
                list-style-type: square;
            }
            ol.a
            {
                list-style-type: upper-roman;
            }
            ol.b
            {
                list-style-type: lower-alpha;
            }
        </style>
    </head>
    <body>
        <h1> the list style type property</h1>
        <p>example of unordered ,list :</p>
        <ul class="a">
            <li>coffee</li>
            <li> tea</li>
            <li> coca</li>
        </ul>
        <ul class="b">
            <li> coffee</li>
            <li> tea</li>
            <li> coca</li>
        </ul>

        <p> example of ordered list:</p>
        <ol class="a">
            <li> coffee</li>
            <li>tea</li>
            <li>coca</li>
        </ol>
        <ol class="b">
            <li>coffee</li>
            <li>tea</li>
            <li>coca</li>
        </ol>
    </body>
</html>
