<html>
    <head>
        <title> margin padding example</title>
        <style>
            p
            {
                border: 5px solid yellow;
                margin: left 5px;
                margin-right: 20px;
                margin-bottom: 20px;
                margin-top: 20px;
                padding: 10px;

            }

        </style>
    </head>
    <body>
        <h1> padding property</h1>
        <p> my first para</p>
        <p> my first para</p>
        <p> my first para</p>

    </body>
</html>
