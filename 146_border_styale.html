<html>
    <head>
        <title>    border property  example</title>
        <style>
            p.dotted {  padding: 5px; border-style: dotted; border-width: 10px; }
            p.dashed {  padding: 5px;border-style: dashed; border-width: 10px;}
            p.solid  {  padding: 5px;border-style:solid ;}
            p.double {  padding: 5px; border-style: double; border-width: 10px; }
            p.groove {  padding: 5px;border-style: groove; border-width: 10px;}
            p.ridge  {  padding: 5px;border-style:ridge ;}
            p.inset  {  padding: 5px;border-style: inset; border-width: 10px; }
            p.outset {  padding: 5px;border-style:outset; border-width: 10px;}
            p.none   {  padding: 5px;border-style: none;}
            p.hidden {  padding: 5px;border-style: hidden; border-width: 10px; }
            p.mix    {  padding: 5px;border-style: dotted dashed solid double ;}
            
        </style>
    </head>
    <body>
        <h2> border-style property</h2>
        <p> this property specified what kind of border to display</p>
        <p class="dotted "> bca</p>
        <p class="dashed "> bca</p>
        <p class="solid  "> bca</p>
        <p class="double "> bca</p>
        <p class="groove "> bca</p>
        <p class="ridge  "> bca</p>
        <p class="inset  "> bca</p>
        <p class="outset "> bca</p>
        <p class="none   "> bca</p>
        <p class="hidden "> bca</p>
        <p class="mix  "> bca</p>
    </body>
</html>
