<html>
    <head>
        <title> radial grandients example</title>
        <style>
            #grad{
                height: 200px;
    
            
                 background-image:repeating-radial-gradient(circle, red ,yellow,10%,green 15%); 
               /* background-image: conic-gradient(purple,cyan,rgb(24, 113, 149),rgb(0, 150, 0),yellow,orange,red);*/
                }
            #grad:hover
            {
                transform: translate(20px,20px);
                /* transform: rotate(90deg); */
                transform: skewX(20deg);
                transform: skewY(20deg);
            }
        </style>
    </head>
    <body>
        <div id="grad"></div>
    </body>
</html>
