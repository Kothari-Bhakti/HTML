<html>
    <head>
        <title> 3D TRANSFORM PROPERTY </title>
        <style>
           .box
           {
                   margin-top: 100px;
                   margin-left: 300px;
                   background-color: rgb(237, 81, 25);
                   height: 100px;
                   width: 150px;
                   border-radius:50px;
                   transition: all 4s linear 1s;

           }
           .box:hover
           {
          /*  transform:rotateX(360deg) ;*/
          /*  transform: rotateY(360deg) ;*/
           transform: rotateZ(360deg);
           }

        </style>
    </head>
    <body>
        <div class="box" align="center"> BHAKTI</div>
    </body>
</html>
