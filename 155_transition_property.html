<html>
<head>
    <title> transition property</title>
    <style>
        div
        {
            background-color: rgb(237, 81, 25);
            height: 100px;
            width: 150px;
            transition:width 2s, height 2s,transform 2s;
            transition-delay: 5s;
        }
        div:hover
        {
            width: 300px;
            height: 200px;
            transform: scale(180deg);
        }
    </style>
</head>
<body>
    <h1>transition + transform</h1>
    <p> hover over the div elementn below,to see the transition effect</p>
    <div></div>
</body>
</html>
