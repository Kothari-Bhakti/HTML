<html>
    <head>
        <title>      HTML5:  how to define an odered list</title>
    </head>
    <body>
        <h1>
            <font size="+6">   HTML5:HOW TO DEFINE AN ORDERED LIST?</font>
        </h1>
        <dl>
            <dt>   reversed  attribute</dt>
        
            <ol type ="1" reversed="3">
                <li> HTML</li>
                <li>CSS</li>
                <li>JS</li>
            </ol>
            <dt> start attribute</dt>
            <ol type start="5"> 
                <li> HTML</li>
                <li>CSS</li>
                <li>JS</li>
            </ol>
                <dt>  type attribute  </dt>
                <ol type="i" >
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JS</li>
                </ol>   
    </body>
</html>
