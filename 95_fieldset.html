<html>
    <head>
        <title>
            fieldset tag example
        </title>
    </head>
    <body>
        <form action="11-bolditalicu.html">

            <fieldset>

            <legend>COURSE DETAIL</legend>

            COURSE NAME:

            <input type="text" name="txtnm" ><br><br>

            FEES:

            <input type="number" name="txtf" >
            </fieldset>
            <fieldset>
            <legend> FAVORITE COLOR</legend>
            RED:
            <input type="checkbox" name="chkred" ><br><br>
            YELLOW:
            <input type="checkbox" name="chkyellow"><br><br>
            <input type="submit" name="btnsub" >
            </fieldset>
        </form>
    </body>
</html>
